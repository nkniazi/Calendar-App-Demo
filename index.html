<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeBalance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#calendar-view" class="skip-link">Skip to calendar</a>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar navigation">
      <div class="sidebar-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>LifeBalance</span>
      </div>
      <button id="new-event-btn" class="new-event-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Event
      </button>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <button id="nav-dashboard" class="nav-item active" data-page="dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
        <button id="nav-calendar" class="nav-item" data-page="calendar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </button>
        <button id="nav-tasks" class="nav-item" data-page="tasks">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Tasks
        </button>
        <button id="nav-goals" class="nav-item" data-page="goals">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          Goals
        </button>
        <button id="nav-settings" class="nav-item" data-page="settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </button>
      </nav>
      <div class="mini-calendar">
        <div class="mini-cal-header">
          <span id="mini-month-year" class="mini-month-label"></span>
          <div class="mini-cal-nav">
            <button id="mini-prev" aria-label="Previous month">&#8249;</button>
            <button id="mini-next" aria-label="Next month">&#8250;</button>
          </div>
        </div>
        <div id="mini-cal-weekdays" class="mini-cal-weekdays"></div>
        <div id="mini-cal-grid" class="mini-cal-grid"></div>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-section-title">My Calendars</h3>
        <div id="calendar-list" class="calendar-list"></div>
      </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="sidebar-toggle" class="icon-btn sidebar-toggle-btn" aria-label="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <button id="today-btn" class="today-btn">Today</button>
          <div class="nav-arrows">
            <button id="prev-btn" class="nav-btn" aria-label="Previous">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button id="next-btn" class="nav-btn" aria-label="Next">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
            </button>
          </div>
          <h2 id="date-heading" class="date-heading" aria-live="polite"></h2>
        </div>
        <div class="toolbar-right">
          <div id="view-switcher" class="view-switcher" role="tablist" aria-label="Calendar view">
            <button data-view="day" role="tab" aria-selected="false">Day</button>
            <button data-view="3day" role="tab" aria-selected="false">3 Days</button>
            <button data-view="week" role="tab" aria-selected="true" class="active">Week</button>
            <button data-view="month" role="tab" aria-selected="false">Month</button>
            <button data-view="agenda" role="tab" aria-selected="false">Agenda</button>
            <button data-view="year" role="tab" aria-selected="false">Year</button>
          </div>
        </div>
      </header>
      <div id="calendar-view" class="calendar-view"></div>
    </main>
  </div>

  <div id="ai-panel" class="ai-panel hidden" aria-hidden="true">
    <div class="ai-panel-header">
      <div class="ai-panel-title-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 014 4v1a2 2 0 012 2v1a2 2 0 01-2 2H8a2 2 0 01-2-2V9a2 2 0 012-2V6a4 4 0 014-4z"/><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 14v4"/></svg>
        <h3>LifeBalance AI</h3>
        <span id="ai-mode-badge" class="ai-mode-badge hidden">Demo</span>
      </div>
      <button id="ai-panel-close" class="ai-panel-close" aria-label="Close AI panel">&times;</button>
    </div>
    <div class="ai-panel-body">
      <div class="ai-command-bar">
        <input type="text" id="ai-command-input" class="ai-command-input" placeholder="Ask AI to schedule something..." maxlength="200">
        <button id="ai-command-send" class="ai-command-send" aria-label="Send command">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="ai-actions">
        <button id="ai-plan-day" class="ai-action-btn">Plan My Day</button>
        <button id="ai-plan-week" class="ai-action-btn">Plan My Week</button>
      </div>
      <div id="ai-rate-limit" class="ai-rate-limit"></div>
      <div id="ai-content" class="ai-content">
        <p class="ai-empty-msg">Click "Plan My Day" or type a command to get AI suggestions.</p>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">New Event</h2>
        <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="event-form" novalidate>
        <div class="form-group">
          <label for="event-title">Event name</label>
          <input type="text" id="event-title" placeholder="Add title" maxlength="100" autocomplete="off">
          <span class="error-msg" id="title-error"></span>
        </div>
        <div class="form-row">
          <label class="toggle-label">
            <input type="checkbox" id="event-allday">
            <span class="toggle-switch"></span>
            All day
          </label>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="event-date">Date</label>
            <input type="date" id="event-date">
            <span class="error-msg" id="date-error"></span>
          </div>
        </div>
        <div class="form-row form-row-time" id="time-row">
          <div class="form-group form-group-half">
            <label for="event-start">Start</label>
            <input type="time" id="event-start" step="900">
          </div>
          <span class="time-separator">—</span>
          <div class="form-group form-group-half">
            <label for="event-end">End</label>
            <input type="time" id="event-end" step="900">
          </div>
        </div>
        <div class="form-group">
          <label>Category</label>
          <div id="category-picker" class="category-picker"></div>
        </div>
        <div class="form-row" id="priority-row" style="display:none">
          <div class="form-group">
            <label>Priority</label>
            <div id="priority-picker" class="priority-picker">
              <button type="button" class="prio-btn prio-low" data-prio="low">Low</button>
              <button type="button" class="prio-btn prio-med" data-prio="medium">Medium</button>
              <button type="button" class="prio-btn prio-high" data-prio="high">High</button>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="event-desc">Description</label>
          <textarea id="event-desc" rows="2" placeholder="Add description" maxlength="500"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" id="delete-btn" class="btn btn-danger hidden">Delete</button>
          <div class="modal-footer-right">
            <button type="button" id="cancel-btn" class="btn btn-ghost">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Event</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
