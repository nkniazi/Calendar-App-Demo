<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="calendar-header">
      <div class="nav-group">
        <button id="prev-month" aria-label="Previous month">&larr;</button>
        <h1 id="current-month-year"></h1>
        <button id="next-month" aria-label="Next month">&rarr;</button>
      </div>
      <button id="today-btn" class="btn-today">Today</button>
    </header>

    <div class="filter-bar">
      <span class="filter-label">Filter:</span>
      <div id="category-filters" class="category-filters"></div>
    </div>

    <div class="weekday-labels" id="weekday-labels"></div>

    <div id="calendar-grid" class="calendar-grid"></div>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal" role="dialog" aria-labelledby="modal-title">
        <h2 id="modal-title">Add Event</h2>
        <form id="event-form" novalidate>
          <div class="form-group">
            <label for="event-title">Title <span class="required">*</span></label>
            <input type="text" id="event-title" maxlength="100" placeholder="Event title">
            <span class="error-msg" id="title-error"></span>
          </div>
          <div class="form-group">
            <label for="event-date">Date <span class="required">*</span></label>
            <input type="date" id="event-date">
            <span class="error-msg" id="date-error"></span>
          </div>
          <div class="form-group">
            <label for="event-category">Category</label>
            <select id="event-category">
              <option value="default">General</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="health">Health</option>
              <option value="social">Social</option>
            </select>
          </div>
          <div class="form-group">
            <label for="event-time">Time</label>
            <input type="time" id="event-time">
          </div>
          <div class="form-group">
            <label for="event-description">Description</label>
            <textarea id="event-description" rows="3" maxlength="500" placeholder="Optional description"></textarea>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
            <button type="button" id="delete-btn" class="btn-danger hidden">Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
